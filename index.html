<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXURY - Haute Couture & High Jewelry</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- NAVBAR -->
  <header class="bg-slate-900 text-white fixed top-0 w-full z-30 h-16 flex items-center justify-between px-6 shadow-md">
    <div class="flex items-center gap-3">
      <!-- AVATAR DO UTILIZADOR -->
      <img id="nav-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="Avatar" class="w-9 h-9 rounded-full object-cover border-2 border-amber-500 cursor-pointer hover:opacity-80 transition" onclick="abrirPerfilModal()" title="Editar Perfil">
      
      <button onclick="toggleDrawer()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700 flex items-center gap-2 transition">
        <span>Wishlist</span>
        <span id="wishlist-badge" class="bg-amber-500 text-slate-950 font-bold rounded-full w-4 h-4 text-[10px] flex items-center justify-center">0</span>
      </button>

      <button onclick="abrirPerfilModal()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700 text-amber-400 font-semibold transition">
        Meu Perfil VIP
      </button>
    </div>

    <!-- NAVEGAÇÃO / FILTROS DA NAVBAR -->
    <div class="hidden md:flex gap-4 text-xs font-semibold text-gray-300">
      <button onclick="filtrarCategoria('todos')" class="hover:text-amber-400 transition uppercase tracking-wider px-2 py-1">Todos</button>
      <button onclick="filtrarCategoria('relogios')" class="hover:text-amber-400 transition uppercase tracking-wider px-2 py-1">Relógios</button>
      <button onclick="filtrarCategoria('bolsas')" class="hover:text-amber-400 transition uppercase tracking-wider px-2 py-1">Bolsas</button>
      <button onclick="filtrarCategoria('vestuario')" class="hover:text-amber-400 transition uppercase tracking-wider px-2 py-1">Atelier</button>
      <button onclick="filtrarCategoria('perfumes')" class="hover:text-amber-400 transition uppercase tracking-wider px-2 py-1">Perfumes</button>
    </div>

    <div class="flex items-center gap-3">
      <span id="user-display" class="text-xs text-amber-400 font-bold">VIP: Gabriel</span>
      <button id="auth-btn" onclick="handleAuthClick()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-4 py-1.5 rounded transition">Sair</button>
    </div>
  </header>

  <!-- DRAWER LATERAL (WISHLIST) -->
  <aside id="drawer" class="fixed top-0 left-0 w-80 h-full bg-slate-900 text-white z-50 transform -translate-x-full transition-transform duration-300 p-6 flex flex-col justify-between shadow-2xl">
    <div class="flex-1 overflow-y-auto">
      <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-3">
        <h2 class="font-bold text-amber-400 text-sm uppercase tracking-wider">Maison VIP - Wishlist</h2>
        <button onclick="toggleDrawer()" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
      </div>
      <h3 class="text-xs font-bold text-gray-400 uppercase mb-3 tracking-widest">Coleção Selecionada</h3>
      <div id="wishlist-container" class="space-y-3 text-xs"></div>
    </div>

    <div class="border-t border-slate-800 pt-4 mt-4">
      <div class="flex justify-between items-center mb-4 text-xs">
        <span class="text-gray-400 uppercase">Total Estimado</span>
        <span id="wishlist-total" class="text-amber-400 font-bold text-sm">R$ 0</span>
      </div>
      <button onclick="finalizarReserva()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs py-3 rounded uppercase tracking-wider transition">
        Solicitar Concierge
      </button>
    </div>
  </aside>
  <div id="overlay" onclick="fecharPaineis()" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm"></div>

  <!-- MODAL DE PERFIL VIP (UPLOAD DE FICHEIRO) -->
  <div id="modal-perfil" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden backdrop-blur-sm">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg relative">
      <button onclick="fecharPerfilModal()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-700 font-bold text-lg">&times;</button>
      
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-slate-900 font-serif">PERFIL DO MEMBRO VIP</h2>
        <p class="text-xs text-amber-600 font-semibold uppercase tracking-widest">Personalize suas preferências</p>
      </div>

      <form onsubmit="salvarPerfil(event)" class="space-y-4">
        <!-- SELEÇÃO DE FOTO POR FICHEIRO/ARQUIVO -->
        <div class="flex flex-col items-center gap-3 mb-4">
          <img id="profile-preview-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="Foto de Perfil" class="w-24 h-24 rounded-full object-cover border-4 border-amber-500 shadow-md">
          
          <div class="w-full text-center">
            <label for="profile-file-input" class="cursor-pointer bg-slate-900 hover:bg-slate-800 text-amber-400 text-xs font-bold px-4 py-2 rounded uppercase tracking-wider transition inline-block">
              📷 Escolher Foto do Computador
            </label>
            <input type="file" id="profile-file-input" accept="image/*" class="hidden" onchange="previewFoto(event)">
            <p class="text-[10px] text-gray-400 mt-1">Formatos suportados: JPG, PNG, WEBP</p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Nome Completo</label>
            <input type="text" id="profile-name" required value="Gabriel Silva" class="w-full p-2 border rounded text-xs focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">E-mail VIP</label>
            <input type="email" id="profile-email" required value="gabriel@maison.com" class="w-full p-2 border rounded text-xs focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Título / Status VIP</label>
          <select id="profile-status" class="w-full p-2 border rounded text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            <option value="Membro Black VIP">Membro Black VIP</option>
            <option value="Colecionador Privé">Colecionador Privé</option>
            <option value="Embaixador Maison">Embaixador Maison</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Sobre Você / Preferências de Estilo</label>
          <textarea id="profile-bio" rows="2" class="w-full p-2 border rounded text-xs focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Ex: Apreciador de alta relojoaria e alfaiataria exclusiva.">Apreciador de alta relojoaria e alta-costura.</textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="fecharPerfilModal()" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 rounded text-xs font-bold uppercase transition">Cancelar</button>
          <button type="submit" class="w-1/2 bg-slate-900 hover:bg-slate-800 text-amber-400 py-2.5 rounded text-xs font-bold uppercase transition">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE LOGIN -->
  <div id="modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden backdrop-blur-sm">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md relative">
      <button onclick="toggleModal()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-700 font-bold text-lg">&times;</button>
      <h1 class="text-2xl font-bold text-center text-slate-900 mb-2 font-serif">LUXURY PRIVATE</h1>
      <p class="text-xs text-center text-gray-500 mb-6 uppercase tracking-wider">Acesso Exclusivo para Membros VIP</p>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">E-mail VIP</label>
          <input type="email" id="login-email" required class="w-full mt-1 p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-amber-500 outline-none" placeholder="cliente@maison.com">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Chave de Acesso</label>
          <input type="password" required class="w-full mt-1 p-2.5 border rounded-md text-sm focus:ring-2 focus:ring-amber-500 outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-slate-900 text-amber-400 py-3 rounded-md hover:bg-slate-800 text-xs font-bold uppercase tracking-widest transition">Entrar no Salon</button>
      </form>
    </div>
  </div>

  <!-- GRID DE PRODUTOS -->
  <main class="max-w-7xl mx-auto px-6 pt-24 pb-12 flex-1 w-full">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 border-b border-gray-300 pb-4 gap-4">
      <div>
        <span id="banner-welcome" class="text-xs font-bold text-amber-600 uppercase tracking-widest">Bem-vindo, Gabriel (Membro Black VIP)</span>
        <h1 class="text-2xl font-serif font-bold text-slate-900 uppercase tracking-wider">Catálogo de Peças Exclusivas</h1>
      </div>
      
      <!-- CAMPO DE PESQUISA -->
      <div class="flex items-center gap-3 w-full md:w-auto">
        <input type="text" id="search-input" oninput="filtrarPorTexto()" placeholder="Buscar marca ou peça..." class="px-3 py-1.5 text-xs border rounded-md focus:ring-2 focus:ring-amber-500 outline-none w-full md:w-64">
        <span id="product-count" class="text-xs text-gray-500 font-semibold uppercase whitespace-nowrap">10 Edições</span>
      </div>
    </div>

    <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <script>
    const produtosPadrao = [
      { id: 'p1', marca: 'Gucci', nome: 'Jaqueta Bomber Heritage Monogram GG', categoria: 'vestuario', preco: 48500, img: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&q=80' },
      { id: 'p2', marca: 'Prada', nome: 'Bolsa Tote Leather Edition Royale', categoria: 'bolsas', preco: 32000, img: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&q=80' },
      { id: 'p3', marca: 'Dior', nome: 'Vestido Haute Couture Bordado Dourado', categoria: 'vestuario', preco: 78000, img: 'https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=600&q=80' },
      { id: 'p4', marca: 'Cartier', nome: 'Relógio Ballon Bleu Automatic Stainless Steel', categoria: 'relogios', preco: 38400, img: 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=600&q=80' },
      { id: 'p5', marca: 'Christian Louboutin', nome: 'Scarpin High Heel Red Sole Classic', categoria: 'vestuario', preco: 21500, img: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600&q=80' },
      { id: 'p6', marca: 'Rolex', nome: 'Relógio Submariner Date Blue Dial', categoria: 'relogios', preco: 289000, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80' },
      { id: 'p7', marca: 'Moncler', nome: 'Jaqueta Doudoune Hooded Down Jacket', categoria: 'vestuario', preco: 34500, img: 'https://images.unsplash.com/photo-1544441893-675973e31985?w=600&q=80' },
      { id: 'p8', marca: 'Chanel', nome: 'Parfum Chance Eau Tendre Flacon', categoria: 'perfumes', preco: 42000, img: 'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600&q=80' },
      { id: 'p9', marca: 'Burberry', nome: 'Suéter Check Pattern Cashmere', categoria: 'vestuario', preco: 12400, img: 'https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=600&q=80' },
      { id: 'p10', marca: 'Louis Vuitton', nome: 'Bolsa Monogram Empreinte Leather', categoria: 'bolsas', preco: 58500, img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&q=80' }
    ];

    let wishlistIds = [];
    let produtosExibidos = [...produtosPadrao];
    let fotoTemporaria = null;
    
    let perfilUsuario = {
      nome: 'Gabriel Silva',
      email: 'gabriel@maison.com',
      status: 'Membro Black VIP',
      bio: 'Apreciador de alta relojoaria e alta-costura.',
      foto: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80'
    };

    async function carregarDados() {
      renderGrid(produtosExibidos);
      atualizarWishlist();
      atualizarInterfacePerfil();

      try {
        const resWishlist = await fetch('/api/wishlist');
        if (resWishlist.ok) {
          const wishlist = await resWishlist.json();
          wishlistIds = wishlist.map(w => w.id || w.productId);
          atualizarWishlist();
          renderGrid(produtosExibidos);
        }
      } catch (err) {
        console.warn("Servidor backend offline. Operando localmente.");
      }
    }

    function renderGrid(produtos) {
      const grid = document.getElementById('grid-produtos');
      const countLabel = document.getElementById('product-count');
      if (!grid) return;

      if (countLabel) countLabel.innerText = `${produtos.length} Edição(ões)`;

      if (produtos.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">Nenhum produto encontrado.</div>';
        return;
      }

      grid.innerHTML = produtos.map((p) => {
        const isFav = wishlistIds.includes(p.id);

        return `
          <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm flex flex-col justify-between relative group hover:shadow-xl hover:-translate-y-1 transition duration-300">
            <button onclick="toggleFav('${p.id}')" class="absolute top-3 right-3 z-10 ${isFav ? 'text-red-500' : 'text-gray-300'} hover:text-red-500 text-xl font-bold bg-white/90 rounded-full w-9 h-9 flex items-center justify-center shadow-md transition">♥</button>
            
            <div class="w-full h-52 bg-slate-50 rounded mb-4 overflow-hidden relative border border-slate-100 flex items-center justify-center">
              <img src="${p.img}" alt="${p.nome}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <span class="absolute bottom-2 left-2 bg-slate-900/90 text-amber-400 text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded shadow">${p.marca}</span>
            </div>

            <div class="flex flex-col justify-between flex-1">
              <h3 class="font-bold text-xs text-slate-800 leading-snug line-clamp-2 mb-2">${p.nome}</h3>
              <div class="pt-2 border-t border-slate-100 flex justify-between items-center mb-3">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Valor Estimado</span>
                <p class="text-sm text-slate-900 font-extrabold">R$ ${Number(p.preco).toLocaleString('pt-BR')}</p>
              </div>
              <button onclick="toggleFav('${p.id}')" class="w-full ${isFav ? 'bg-red-50 hover:bg-red-100 text-red-600 border border-red-200' : 'bg-slate-900 hover:bg-slate-800 text-amber-400'} py-2 rounded text-xs font-bold uppercase tracking-wider transition">
                ${isFav ? 'Remover da Wishlist' : 'Reservar Peça'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function atualizarWishlist() {
      const container = document.getElementById('wishlist-container');
      const badge = document.getElementById('wishlist-badge');
      const totalEl = document.getElementById('wishlist-total');

      if (badge) badge.innerText = wishlistIds.length;

      const itens = produtosPadrao.filter(p => wishlistIds.includes(p.id));
      const total = itens.reduce((acc, item) => acc + item.preco, 0);

      if (totalEl) totalEl.innerText = `R$ ${total.toLocaleString('pt-BR')}`;

      if (!container) return;

      if (itens.length === 0) {
        container.innerHTML = '<p class="text-gray-500 italic text-center py-6">Nenhuma peça reservada na sua wishlist.</p>';
        return;
      }

      container.innerHTML = itens.map(item => `
        <div class="p-3 bg-slate-800/80 rounded-lg flex justify-between items-center border border-slate-700/50">
          <div class="pr-2">
            <p class="text-amber-400 font-bold text-[11px] uppercase">${item.marca}</p>
            <p class="text-gray-200 text-xs truncate max-w-[150px]">${item.nome}</p>
            <p class="text-amber-400 font-bold text-xs mt-0.5">R$ ${Number(item.preco).toLocaleString('pt-BR')}</p>
          </div>
          <button onclick="toggleFav('${item.id}')" class="text-gray-400 hover:text-red-400 text-sm p-1 font-bold">&times;</button>
        </div>
      `).join('');
    }

    async function toggleFav(id) {
      if (wishlistIds.includes(id)) {
        wishlistIds = wishlistIds.filter(item => item !== id);
      } else {
        wishlistIds.push(id);
      }

      try {
        await fetch('/api/wishlist/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: id, id: id })
        });
      } catch (e) {
        console.log("Servidor local não conectado.");
      }

      atualizarWishlist();
      renderGrid(produtosExibidos);
    }

    /* FUNÇÕES DE PREVIEW E UPLOAD DE FOTO LOCAL */
    function previewFoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          fotoTemporaria = e.target.result;
          document.getElementById('profile-preview-img').src = fotoTemporaria;
        };
        reader.readAsDataURL(file);
      }
    }

    function abrirPerfilModal() {
      document.getElementById('profile-name').value = perfilUsuario.nome;
      document.getElementById('profile-email').value = perfilUsuario.email;
      document.getElementById('profile-status').value = perfilUsuario.status;
      document.getElementById('profile-bio').value = perfilUsuario.bio;
      document.getElementById('profile-preview-img').src = perfilUsuario.foto;
      fotoTemporaria = null;
      
      document.getElementById('modal-perfil').classList.remove('hidden');
    }

    function fecharPerfilModal() {
      document.getElementById('modal-perfil').classList.add('hidden');
    }

    function salvarPerfil(e) {
      e.preventDefault();
      
      perfilUsuario.nome = document.getElementById('profile-name').value;
      perfilUsuario.email = document.getElementById('profile-email').value;
      perfilUsuario.status = document.getElementById('profile-status').value;
      perfilUsuario.bio = document.getElementById('profile-bio').value;
      
      if (fotoTemporaria) {
        perfilUsuario.foto = fotoTemporaria;
      }

      atualizarInterfacePerfil();
      fecharPerfilModal();
      alert('Perfil VIP atualizado com sucesso!');
    }

    function atualizarInterfacePerfil() {
      document.getElementById('nav-avatar').src = perfilUsuario.foto;
      document.getElementById('user-display').innerText = `VIP: ${perfilUsuario.nome.split(' ')[0]}`;
      document.getElementById('banner-welcome').innerText = `Bem-vindo, ${perfilUsuario.nome} (${perfilUsuario.status})`;
    }

    function filtrarCategoria(cat) {
      if (cat === 'todos') {
        produtosExibidos = [...produtosPadrao];
      } else {
        produtosExibidos = produtosPadrao.filter(p => p.categoria === cat);
      }
      renderGrid(produtosExibidos);
    }

    function filtrarPorTexto() {
      const termo = document.getElementById('search-input').value.toLowerCase();
      produtosExibidos = produtosPadrao.filter(p => 
        p.marca.toLowerCase().includes(termo) || 
        p.nome.toLowerCase().includes(termo)
      );
      renderGrid(produtosExibidos);
    }

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('-translate-x-full');
      document.getElementById('overlay').classList.toggle('hidden');
    }

    function fecharPaineis() {
      document.getElementById('drawer').classList.add('-translate-x-full');
      document.getElementById('overlay').classList.add('hidden');
    }

    function toggleModal() {
      document.getElementById('modal').classList.toggle('hidden');
    }

    function handleAuthClick() {
      if (perfilUsuario.nome !== 'Visitante') {
        if (confirm("Deseja mesmo sair do Salon VIP?")) {
          document.getElementById('user-display').innerText = 'Visitante';
          document.getElementById('auth-btn').innerText = 'Login VIP';
          perfilUsuario.nome = 'Visitante';
        }
      } else {
        toggleModal();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      perfilUsuario.nome = email.split('@')[0].toUpperCase();
      atualizarInterfacePerfil();
      document.getElementById('auth-btn').innerText = 'Sair';
      toggleModal();
    }

    function finalizarReserva() {
      if (wishlistIds.length === 0) {
        alert('Sua wishlist está vazia. Adicione peças antes de solicitar o Concierge.');
        return;
      }
      alert(`Obrigado Sr(a). ${perfilUsuario.nome}! Sua solicitação foi enviada com sucesso ao seu Concierge VIP.`);
      wishlistIds = [];
      atualizarWishlist();
      renderGrid(produtosExibidos);
      toggleDrawer();
    }

    document.addEventListener('DOMContentLoaded', carregarDados);
  </script>
</body>
</html>
